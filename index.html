<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Base Page Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        /* Top Navigation Bar */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e1e4e8;
            padding: 1rem 2rem;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #24292e;
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #586069;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #0366d6;
        }

        /* Main Content Container */
        main {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a5568;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #6a737d;
            font-size: 0.9rem;
            border-top: 1px solid #e1e4e8;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <!-- Header Navigation (Copy this block to every subpage) -->
    <header>
        <nav>
            <a href="index.html" class="logo">My Website</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Page Content -->
    <main>
        <h1>Welcome to My Website</h1>
        <p>This is the main homepage. You can easily navigate to our <strong>Contact Us</strong> page using the link in the header above to reach out or visit our social channels!</p>
    </main>

    <footer>
        <p>&copy; 2026 My Website. Built with GitHub Pages.</p>
    </footer>

</body>
</html>
